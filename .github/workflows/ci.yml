name: CI Build & Deploy Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 1. Backend Verification
  backend-check:
    name: Backend Syntax & Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Check Backend Server Syntax
        working-directory: backend
        run: node -c src/server.js

  # 2. Frontend Production Build Verification
  frontend-build:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build

  # 3. Production VPS Deployment (runs only on push to main after CI passes)
  deploy-production:
    name: Deploy to Production VPS
    needs: [backend-check, frontend-build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /var/www/qrparky
            if [ ! -d ".git" ]; then
              echo "ERROR: /var/www/qrparky is not a git repository. Initialize git first."
              exit 1
            fi
            git fetch origin main
            git reset --hard origin/main
            cd /var/www/qrparky/backend
            npm install --omit=dev
            cd /var/www/qrparky/frontend
            npm install
            npm run build
            pm2 restart qrparky-backend
            pm2 save
