<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Badge -->
  <rect width="512" height="512" rx="128" fill="url(#dark-grad)" stroke="url(#gold-grad)" stroke-width="16" />
  
  <!-- Outer Gold Corner Brackets (QR Frame) -->
  <!-- Top Left -->
  <rect x="80" y="80" width="130" height="130" rx="24" fill="none" stroke="url(#gold-grad)" stroke-width="22" />
  <rect x="120" y="120" width="50" height="50" rx="12" fill="url(#gold-grad)" />
  
  <!-- Top Right -->
  <rect x="302" y="80" width="130" height="130" rx="24" fill="none" stroke="url(#gold-grad)" stroke-width="22" />
  <rect x="342" y="120" width="50" height="50" rx="12" fill="url(#gold-grad)" />
  
  <!-- Bottom Left -->
  <rect x="80" y="302" width="130" height="130" rx="24" fill="none" stroke="url(#gold-grad)" stroke-width="22" />
  <rect x="120" y="342" width="50" height="50" rx="12" fill="url(#gold-grad)" />
  
  <!-- Center Car / Shield Icon in Gold -->
  <path d="M230 250 L282 250 L298 290 L320 290 C328 290 334 296 334 304 L334 330 C334 336 328 342 322 342 L316 342 C316 352 308 360 298 360 C288 360 280 352 280 342 L232 342 C232 352 224 360 214 360 C204 360 196 352 196 342 L190 342 C184 342 178 336 178 330 L178 304 C178 296 184 290 192 290 L214 290 Z" fill="url(#gold-grad)" filter="url(#glow)" />
  
  <rect x="236" y="260" width="40" height="22" rx="4" fill="#09090b" opacity="0.8" />
</svg>
