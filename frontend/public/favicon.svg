<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="favDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="100" height="100" rx="28" fill="url(#favDark)" stroke="url(#favGold)" stroke-width="4" />
  
  <!-- QR Shield Mark -->
  <g fill="url(#favGold)" transform="translate(20, 20)">
    <!-- Top-Left Target -->
    <rect width="24" height="24" rx="6" />
    <rect x="5" y="5" width="14" height="14" rx="3" fill="url(#favDark)" />
    <rect x="8" y="8" width="8" height="8" rx="2" fill="url(#favGold)" />

    <!-- Top-Right Target -->
    <rect x="36" width="24" height="24" rx="6" />
    <rect x="41" y="5" width="14" height="14" rx="3" fill="url(#favDark)" />
    <rect x="44" y="8" width="8" height="8" rx="2" fill="url(#favGold)" />

    <!-- Bottom-Left Target -->
    <rect y="36" width="24" height="24" rx="6" />
    <rect x="5" y="41" width="14" height="14" rx="3" fill="url(#favDark)" />
    <rect x="8" y="44" width="8" height="8" rx="2" fill="url(#favGold)" />

    <!-- Security Dot Matrix Center -->
    <rect x="38" y="38" width="22" height="22" rx="5" fill="url(#favGold)" />
    <circle cx="49" cy="49" r="4" fill="url(#favDark)" />
  </g>
</svg>
