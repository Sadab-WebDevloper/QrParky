<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Rich Obsidian Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080a" />
      <stop offset="40%" stop-color="#121215" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Luxury Gold Master Gradient -->
    <linearGradient id="goldMaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c20" />
      <stop offset="100%" stop-color="#111114" />
    </linearGradient>

    <!-- Emerald Badge Gradient -->
    <linearGradient id="emeraldBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Luxury Lights -->
  <circle cx="250" cy="180" r="280" fill="#f59e0b" opacity="0.16" filter="url(#glowGold)" />
  <circle cx="950" cy="420" r="260" fill="#f59e0b" opacity="0.12" filter="url(#glowGold)" />
  <circle cx="600" cy="620" r="200" fill="#d97706" opacity="0.08" filter="url(#glowGold)" />

  <!-- Subtle Decorative Grid Background -->
  <g opacity="0.06" stroke="#fbbf24" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- ================= LEFT COLUMN: BRAND & VALUE PROPOSITION ================= -->
  <g transform="translate(85, 95)">
    
    <!-- Top Pill Tag -->
    <g>
      <rect width="310" height="38" rx="19" fill="#1c1917" stroke="#d97706" stroke-width="1.2" />
      <circle cx="22" cy="19" r="5" fill="#f59e0b" />
      <text x="36" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#fde68a" letter-spacing="1">NEXT-GEN VEHICLE ACCESS PASSES</text>
    </g>

    <!-- Main Brand Name with Logo Mark -->
    <g transform="translate(0, 60)">
      <g transform="translate(0, 0)">
        <rect width="64" height="64" rx="18" fill="url(#goldMaster)" />
        <!-- QR Mini Silhouette -->
        <g fill="#09090b" transform="translate(14, 14)">
          <rect width="14" height="14" rx="3" />
          <rect x="22" width="14" height="14" rx="3" />
          <rect y="22" width="14" height="14" rx="3" />
          <rect x="24" y="24" width="10" height="10" rx="2" fill="#09090b" />
          <rect x="3" y="3" width="8" height="8" rx="1.5" fill="#fef08a" />
          <rect x="25" y="3" width="8" height="8" rx="1.5" fill="#fef08a" />
          <rect x="3" y="25" width="8" height="8" rx="1.5" fill="#fef08a" />
        </g>
      </g>
      <text x="80" y="50" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="58" font-weight="900" fill="url(#goldText)" letter-spacing="-1.5">QrParky</text>
    </g>

    <!-- Headline -->
    <text x="0" y="195" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Smart, Encrypted <tspan fill="url(#goldText)">QR Passes</tspan>
    </text>
    <text x="0" y="240" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      for Modern Housing Societies
    </text>

    <!-- Description -->
    <text x="0" y="285" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="500" fill="#a1a1aa" letter-spacing="-0.2">
      Eliminate forged stickers &amp; unauthorized parking.
    </text>
    <text x="0" y="312" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="500" fill="#a1a1aa" letter-spacing="-0.2">
      Automated resident onboarding &amp; instant smartphone verification.
    </text>

    <!-- Feature Highlights -->
    <g transform="translate(0, 360)">
      <!-- Feature 1 -->
      <g>
        <circle cx="10" cy="10" r="10" fill="#065f46" />
        <text x="10" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#34d399" text-anchor="middle">✓</text>
        <text x="30" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#e4e4e7">Instant QR Generation</text>
      </g>

      <!-- Feature 2 -->
      <g transform="translate(210, 0)">
        <circle cx="10" cy="10" r="10" fill="#065f46" />
        <text x="10" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#34d399" text-anchor="middle">✓</text>
        <text x="30" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#e4e4e7">AES-256 Encryption</text>
      </g>

      <!-- Feature 3 -->
      <g transform="translate(410, 0)">
        <circle cx="10" cy="10" r="10" fill="#065f46" />
        <text x="10" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#34d399" text-anchor="middle">✓</text>
        <text x="30" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#e4e4e7">Zero Hardware Needed</text>
      </g>
    </g>

  </g>

  <!-- ================= RIGHT COLUMN: LUXURY VEHICLE PASS PREVIEW ================= -->
  <g transform="translate(730, 85)" filter="url(#cardShadow)">
    
    <!-- Outer Glow Aura -->
    <rect x="-1" y="-1" width="382" height="462" rx="33" fill="none" stroke="url(#goldMaster)" stroke-width="2" opacity="0.6" />

    <!-- Pass Main Card Body -->
    <rect width="380" height="460" rx="32" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.5" />

    <!-- Card Header -->
    <g transform="translate(24, 24)">
      <rect width="38" height="38" rx="10" fill="url(#goldMaster)" />
      <text x="19" y="24" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#09090b" text-anchor="middle">🛡️</text>

      <text x="48" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#f59e0b" letter-spacing="1">OFFICIAL ACCESS PASS</text>
      <text x="48" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Greenwood Palms CHS</text>

      <!-- Active Badge -->
      <rect x="260" y="6" width="72" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <circle cx="272" cy="18" r="3.5" fill="#34d399" />
      <text x="282" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#6ee7b7">ACTIVE</text>
    </g>

    <!-- Divider -->
    <line x1="24" y1="80" x2="356" y2="80" stroke="#27272a" stroke-width="1" />

    <!-- QR Code Center Card -->
    <g transform="translate(90, 100)">
      <rect width="200" height="200" rx="20" fill="#ffffff" />
      
      <!-- Realistic Stylized QR Grid Graphic -->
      <g fill="#09090b" transform="translate(20, 20)">
        <!-- Top Left Eye -->
        <rect width="45" height="45" rx="10" fill="none" stroke="#09090b" stroke-width="6" />
        <rect x="12" y="12" width="21" height="21" rx="5" />

        <!-- Top Right Eye -->
        <rect x="115" width="45" height="45" rx="10" fill="none" stroke="#09090b" stroke-width="6" />
        <rect x="127" y="12" width="21" height="21" rx="5" />

        <!-- Bottom Left Eye -->
        <rect y="115" width="45" height="45" rx="10" fill="none" stroke="#09090b" stroke-width="6" />
        <rect x="12" y="127" width="21" height="21" rx="5" />

        <!-- Encrypted Matrix Pattern -->
        <rect x="58" y="10" width="10" height="24" rx="2" />
        <rect x="74" y="6" width="24" height="10" rx="2" />
        <rect x="58" y="44" width="42" height="10" rx="2" />
        <rect x="10" y="58" width="24" height="10" rx="2" />
        <rect x="44" y="68" width="10" height="34" rx="2" />
        <rect x="64" y="68" width="32" height="32" rx="4" />
        <rect x="106" y="58" width="12" height="44" rx="2" />
        <rect x="130" y="70" width="20" height="10" rx="2" />
        <rect x="58" y="115" width="20" height="12" rx="2" />
        <rect x="90" y="115" width="12" height="35" rx="2" />
        <rect x="115" y="115" width="35" height="12" rx="2" />
        <rect x="120" y="138" width="25" height="12" rx="2" />
      </g>

      <text x="100" y="190" font-family="'Plus Jakarta Sans', monospace" font-size="9" font-weight="800" fill="#71717a" text-anchor="middle">QP-2026-MH02-8821</text>
    </g>

    <!-- Vehicle Details Bar -->
    <g transform="translate(24, 320)">
      <!-- Left Pill: Vehicle No -->
      <rect width="160" height="60" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="14" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#a1a1aa">VEHICLE NUMBER</text>
      <text x="14" y="40" font-family="'Plus Jakarta Sans', monospace" font-size="14" font-weight="900" fill="#ffffff">MH 02 AB 1234</text>
      <text x="14" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#f59e0b">4-Wheeler (Car)</text>

      <!-- Right Pill: Flat & Member -->
      <g transform="translate(172, 0)">
        <rect width="160" height="60" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <text x="14" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#a1a1aa">FLAT &amp; MEMBER</text>
        <text x="14" y="40" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">A-402 • Aarav M.</text>
        <text x="14" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#a1a1aa">Owner Resident</text>
      </g>
    </g>

    <!-- Verified Windshield Strip -->
    <g transform="translate(24, 395)">
      <rect width="332" height="38" rx="12" fill="#2d1b06" stroke="#b45309" stroke-width="1" />
      <text x="16" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#fef08a">🛡️ Verified Windshield Pass</text>
      <text x="316" y="24" font-family="'Plus Jakarta Sans', monospace" font-size="11" font-weight="700" fill="#fcd34d" text-anchor="end">Valid 2026-2027</text>
    </g>

  </g>

  <!-- URL Branding Bar Bottom -->
  <text x="85" y="585" font-family="'Plus Jakarta Sans', monospace" font-size="14" font-weight="700" fill="#71717a">
    https://qrparky.com • Smart Society Gate Security Platform
  </text>
</svg>
